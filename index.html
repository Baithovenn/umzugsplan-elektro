<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeitstrahl wird geladen …</title>
  <style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#edf2f5;color:#61727f;font:14px/1.4 "Segoe UI",system-ui,sans-serif}</style>
</head>
<body>
  <div>Zeitstrahl wird geladen …</div>
  <script>
  (async()=>{
    try{
      const r=await fetch(`timeline-basis.html?ts=${Date.now()}`,{cache:"no-store"});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      let html=await r.text();
      html=html.replace('Zeitstrahl V1.1','Zeitstrahl V1.2');
      html=html.replace('<nav class="main-nav" aria-label="Ansichten"><a class="nav-btn" href="index.html">Raumansicht</a><span class="nav-btn active" aria-current="page">Zeitstrahl</span></nav>','<nav class="main-nav" aria-label="Ansichten"><span class="nav-btn active" aria-current="page">Zeitstrahl</span><a class="nav-btn" href="raumansicht.html">Raumansicht</a></nav>');
      html=html.replace('Zeitstrahl mit der Maus ziehen oder seitlich scrollen · ← → springt von Termin zu Termin · Klick auf eine Karte zeigt Details','Zeitfläche mit der Maus in alle Richtungen ziehen oder scrollen · ← → springt von Termin zu Termin · Klick auf eine Karte zeigt Details');
      html=html.replace('touch-action:pan-y','touch-action:none');
      const oldDrag='function enableDrag(){const sc=$("#canvasScroll");let active=false,startX=0,startScroll=0,moved=false;sc.addEventListener("pointerdown",e=>{if(e.button!==0||e.target.closest(".card,.knot,.break-label,button,a"))return;active=true;moved=false;startX=e.clientX;startScroll=sc.scrollLeft;sc.classList.add("dragging");sc.setPointerCapture(e.pointerId)});sc.addEventListener("pointermove",e=>{if(!active)return;const dx=e.clientX-startX;if(Math.abs(dx)>3)moved=true;sc.scrollLeft=startScroll-dx});const end=e=>{if(!active)return;active=false;sc.classList.remove("dragging");try{sc.releasePointerCapture(e.pointerId)}catch(_){}if(moved)e.preventDefault()};sc.addEventListener("pointerup",end);sc.addEventListener("pointercancel",end);sc.addEventListener("lostpointercapture",()=>{active=false;sc.classList.remove("dragging")})}';
      const newDrag='function enableDrag(){const sc=$("#canvasScroll");let active=false,startX=0,startY=0,startScrollX=0,startScrollY=0,moved=false;sc.addEventListener("pointerdown",e=>{if(e.button!==0||e.target.closest(".card,.knot,.break-label,button,a"))return;active=true;moved=false;startX=e.clientX;startY=e.clientY;startScrollX=sc.scrollLeft;startScrollY=window.scrollY;sc.classList.add("dragging");sc.setPointerCapture(e.pointerId)});sc.addEventListener("pointermove",e=>{if(!active)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.hypot(dx,dy)>3)moved=true;sc.scrollLeft=startScrollX-dx;window.scrollTo(window.scrollX,startScrollY-dy)});const end=e=>{if(!active)return;active=false;sc.classList.remove("dragging");try{sc.releasePointerCapture(e.pointerId)}catch(_){}if(moved)e.preventDefault()};sc.addEventListener("pointerup",end);sc.addEventListener("pointercancel",end);sc.addEventListener("lostpointercapture",()=>{active=false;sc.classList.remove("dragging")})}';
      html=html.replace(oldDrag,newDrag);
      document.open();document.write(html);document.close();
    }catch(err){document.body.innerHTML='<div style="max-width:620px;padding:24px">Der Zeitstrahl konnte nicht geladen werden. Bitte die Seite neu laden.</div>';console.error(err)}
  })();
  </script>
</body>
</html>
