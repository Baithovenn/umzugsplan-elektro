name: Raumansicht Ladehinweis formatieren

on:
  push:
    paths:
      - '.github/workflows/patch-raumansicht-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ladehinweis sauber einrücken
        shell: python
        run: |
          from pathlib import Path
          path = Path('raumansicht.html')
          s = path.read_text(encoding='utf-8')
          old = '\n'.join([
              '    <div class="page">',
              '            <section id="loadError" class="help-card" style="margin:0 0 14px">',
              '        <h3 id="loadErrorTitle">Aktueller Plan wird geladen …</h3>',
              '        <p id="loadErrorText">Die Raumansicht lädt den aktuellen Datenstand aus data.json.</p>',
              '        <button class="timeline-btn" id="reloadDataBtn" type="button" hidden>Neu laden</button>',
              '      </section>',
              '<header class="print-heading">'
          ])
          new = '\n'.join([
              '    <div class="page">',
              '      <section id="loadError" class="help-card" style="margin:0 0 14px">',
              '        <h3 id="loadErrorTitle">Aktueller Plan wird geladen …</h3>',
              '        <p id="loadErrorText">Die Raumansicht lädt den aktuellen Datenstand aus data.json.</p>',
              '        <button class="timeline-btn" id="reloadDataBtn" type="button" hidden>Neu laden</button>',
              '      </section>',
              '      <header class="print-heading">'
          ])
          assert old in s, 'Zu bereinigender Ladehinweis nicht gefunden'
          s = s.replace(old, new, 1)
          path.write_text(s, encoding='utf-8')
      - name: Änderung committen
        run: |
          git config user.name "Baithovenn"
          git config user.email "to.sauter@gmx.de"
          git add raumansicht.html
          git diff --cached --check
          git commit -m "Ladehinweis der Raumansicht sauber formatieren"
          git push
