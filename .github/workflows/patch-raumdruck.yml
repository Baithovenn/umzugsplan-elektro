name: Raumdruck auf zwei Seiten umstellen

on:
  push:
    paths:
      - '.github/workflows/patch-raumdruck.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drucklayout gezielt anpassen
        shell: python
        run: |
          from pathlib import Path

          path = Path('raumansicht.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
            '.building-layout{display:grid!important;grid-template-columns:minmax(0,1fr) 71mm;gap:3mm;align-items:stretch;height:248mm}':
            '.building-layout{display:block!important;height:auto!important;min-height:0!important}',

            '.rooms-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:3mm;height:248mm}':
            '.rooms-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:3mm;height:248mm;break-after:page;page-break-after:always}',

            '.side-grid{display:grid!important;grid-template-columns:1fr;grid-template-rows:5.5mm repeat(3,minmax(0,1fr));gap:3mm;height:248mm}':
            '.side-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto 1fr;gap:4mm;height:auto!important;min-height:0!important;align-items:start}',

            '.side-label{margin:0;font-size:9pt}':
            '.side-label{grid-column:1/-1;margin:0 0 2mm;padding:0 0 2mm;border-bottom:.6mm solid #006b73;color:#111;font-size:16pt;font-weight:800;letter-spacing:0;text-transform:none}',

            'body.print-a4 .building-layout{grid-template-columns:minmax(0,1fr) 50mm;gap:2mm;height:174mm}':
            'body.print-a4 .building-layout{height:auto!important;min-height:0!important}',

            'body.print-a4 .rooms-grid{gap:2mm;height:174mm}':
            'body.print-a4 .rooms-grid{gap:2mm;height:174mm;break-after:page;page-break-after:always}',

            'body.print-a4 .side-grid{grid-template-rows:4mm repeat(3,minmax(0,1fr));gap:2mm;height:174mm}':
            'body.print-a4 .side-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto 1fr;gap:2mm;height:auto!important}',

            'body.print-a4 .side-label{font-size:6.5pt}':
            'body.print-a4 .side-label{font-size:11pt}'
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Erwartete Druckregel nicht eindeutig gefunden ({count}x): {old[:80]}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

          work = Path('ARBEITSSTAND.md')
          w = work.read_text(encoding='utf-8')
          anchor = '**03.09.2026**\n'
          note = ('\n- Raumansicht Drucklayout geändert: Blatt 1 enthält ausschließlich FI-U1 bis FI-U9 im 3×3-Raster; '
                  'Blatt 2 enthält Büro A1, Büro A2 und Küche/Nebenbereich. Bildschirmansicht und `data.json` unverändert.\n')
          if note.strip() not in w:
              if anchor not in w:
                  raise SystemExit('Arbeitsstand-Anker nicht gefunden')
              w = w.replace(anchor, anchor + note, 1)
              work.write_text(w, encoding='utf-8')

      - name: Änderung committen
        run: |
          git config user.name "Sauter"
          git config user.email "actions@users.noreply.github.com"
          git add raumansicht.html ARBEITSSTAND.md
          git diff --cached --check
          git commit -m "Raumansicht auf zwei Druckseiten aufteilen"
          git push
