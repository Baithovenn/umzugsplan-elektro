name: update-terminplan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-terminplan.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Daten aktualisieren
        run: python3 .github/update-terminplan.py
      - name: Änderungen prüfen und committen
        run: |
          python3 -m json.tool data.json >/dev/null
          git config user.name "Sauter"
          git config user.email "sauter@users.noreply.github.com"
          git rm .github/update-terminplan.py .github/workflows/update-terminplan.yml
          git add data.json ARBEITSSTAND.md
          git commit -m "Terminplan und Raumzuordnungen aktualisieren"
          git push
