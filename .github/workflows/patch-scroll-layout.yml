name: Einmalige Scroll-Layout-Korrektur

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-scroll-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bildschirm-Layout korrigieren
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"    /\* Auf dem gezeigten Laptop \(effektiv etwa 1536 × 960 CSS-Pixel\) passt die gesamte Ansicht ohne Scrollen\. \*/\n"
              r"    @media \(min-width:1181px\) and \(max-height:1050px\)\{.*?\n    \}\n\n"
              r"(?=    @media\(max-width:1180px\))",
              re.S,
          )

          replacement = '''    /* Kompakte Laptopansicht mit vollständigem Inhalt: vertikales Scrollen statt Abschneiden. */
    @media (min-width:1181px) and (max-height:1050px){
      .app-header{min-height:58px;padding:7px 16px;gap:13px}.brand{min-width:245px}.brand h1{font-size:17px}.nav-btn{padding:7px 11px}.header-btn,.header-select{padding:6px 9px}.header-select{padding-right:25px}
      #panel-view .page{min-height:calc(100vh - 58px);height:auto;display:block;padding:7px 15px 12px;overflow:visible}
      .view-toolbar{min-height:34px;margin-bottom:6px}.date-chip{padding:5px 9px}.date-chip strong{font-size:15px}
      .building-layout{height:auto;min-height:0}.rooms-grid,.side-grid{height:auto;min-height:0;grid-auto-rows:auto}
      .room-card,.room-card.side{min-height:0;height:auto}.side-label{font-size:10px}.room-card.side .room-items{grid-template-columns:repeat(2,minmax(0,1fr))}
      .event-changes{max-height:none;overflow:visible}
      .timeline-shell{position:relative;bottom:auto;margin-top:7px}
    }

'''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Erwarteter Laptop-Media-Query nicht eindeutig gefunden: {count}')

          # Druck-CSS bleibt bewusst unangetastet.
          if '@media print' not in new_text or '@page{size:A3 landscape' not in new_text or 'body.print-a4' not in new_text:
              raise SystemExit('Druck-CSS-Prüfung fehlgeschlagen')

          path.write_text(new_text, encoding='utf-8')

          work = Path('ARBEITSSTAND.md')
          stand = work.read_text(encoding='utf-8')
          anchor = '**02.09.2026**\n\n'
          bullet = '- Viewer-Layout auf Desktop/Laptop korrigiert: vertikales Scrollen erlaubt, Raumkarten wachsen vollständig mit ihrem Inhalt und der Zeitstrahl folgt nach den Räumen. Drucklayout A3/A4 unverändert.\n'
          if bullet not in stand:
              if anchor not in stand:
                  raise SystemExit('ARBEITSSTAND-Anker nicht gefunden')
              stand = stand.replace(anchor, anchor + bullet, 1)
              work.write_text(stand, encoding='utf-8')
          PY

      - name: Änderung committen
        shell: bash
        run: |
          git config user.name "Sauter"
          git config user.email "sauter@users.noreply.github.com"
          git rm .github/workflows/patch-scroll-layout.yml
          git add index.html ARBEITSSTAND.md
          git commit -m "Viewer: vollständige Scrollansicht statt abgeschnittener Raumkarten"
          git push
