name: patch-next-move

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSS und Legende
        run: |
          python3 -c 'from pathlib import Path;p=Path("index.html");s=p.read_text(encoding="utf-8");a="    @media print{\n";b="    /* Bildschirmhinweis auf den nächsten tatsächlichen Bewegungstermin. */\n    @media screen{.asset-tile.next-up.future{opacity:1;border:1.5px solid #d59a3a;border-style:solid;background:#fff8e9;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(189,113,0,.05)}.asset-tile.next-up.future .asset-icon{background:#a97a32}.asset-tile.next-out.present{background:linear-gradient(90deg,#f4fbf8 0%,#f4fbf8 82%,#fff0cf 100%)}.legend-swatch.next-up{opacity:1;background:#fff8e9;border:1.5px solid #d59a3a}}\n\n";assert "asset-tile.next-up" not in s;s=s.replace(a,b+a,1);s=s.replace("<span class=\"legend-item\"><i class=\"legend-swatch due\"></i> am Termin</span><span class=\"legend-item\"><i class=\"legend-swatch future\"></i> kommt später</span>","<span class=\"legend-item\"><i class=\"legend-swatch due\"></i> am Termin</span><span class=\"legend-item\"><i class=\"legend-swatch next-up\"></i> als Nächstes</span><span class=\"legend-item\"><i class=\"legend-swatch future\"></i> kommt später</span>",1);s=s.replace("<li>Gestrichelt orange: laut Plan fällig, aber noch nicht bestätigt.</li><li>Grau: kommt erst später oder Termin offen.</li>","<li>Gestrichelt orange: laut Plan fällig, aber noch nicht bestätigt.</li><li>Hellorange: gehört zum nächsten tatsächlichen Bewegungstermin nach dem gewählten Datum.</li><li>Grau: kommt erst später oder Termin offen.</li>",1);p.write_text(s,encoding="utf-8")'
      - name: Logik für nächsten Bewegungstermin
        run: |
          python3 -c 'from pathlib import Path;p=Path("index.html");s=p.read_text(encoding="utf-8");a="    function nextMoveAfter(asset, iso) {\n      const day = isoDay(iso);\n      return sortMoves(activeMovesFor(asset.id)).find(x => x.day === null || x.day > day)?.move || null;\n    }\n\n";b=a+"    function nextVisibleMoveDateAfter(iso) {\n      const day = isoDay(iso);\n      return data.moves.filter(move => move.status !== \"cancelled\" && move.status !== \"done\" && (!move.eventId || eventById(move.eventId)?.status !== \"cancelled\")).map(move => ({move,date:moveDate(move),day:isoDay(moveDate(move))})).filter(({move,day:moveDay}) => moveDay !== null && moveDay > day && (locationById(move.from)?.visible?.match(/main|side/) || locationById(move.to)?.visible?.match(/main|side/))).sort((a,b) => a.day-b.day)[0]?.date || \"\";\n    }\n\n";assert a in s;s=s.replace(a,b,1);s=s.replace("      const appearances = buildAppearances(selectedISO,validation);\n      appearanceRegistry = new Map();","      const appearances = buildAppearances(selectedISO,validation);\n      const nextVisibleISO = nextVisibleMoveDateAfter(selectedISO);\n      appearanceRegistry = new Map();",1);p.write_text(s,encoding="utf-8")'
      - name: Raumkarten markieren
        run: |
          python3 -c 'from pathlib import Path;p=Path("index.html");s=p.read_text(encoding="utf-8");a="          const sourceSelected = eventMoves.some(m => m.assetId === app.asset.id && m.from === location.id);\n          const key = `${location.id}|${app.asset.id}|${app.state}|${index}`;";b="          const sourceSelected = eventMoves.some(m => m.assetId === app.asset.id && m.from === location.id);\n          const upcomingMove = nextMoveAfter(app.asset,selectedISO);\n          const isNextGlobalMove = !!nextVisibleISO && !!upcomingMove && moveDate(upcomingMove) === nextVisibleISO;\n          const nextDirection = isNextGlobalMove && app.location === upcomingMove.to ? \"in\" : isNextGlobalMove && app.location === upcomingMove.from ? \"out\" : \"\";\n          const nextClass = nextDirection === \"in\" ? \" next-up\" : nextDirection === \"out\" ? \" next-out\" : \"\";\n          const key = `${location.id}|${app.asset.id}|${app.state}|${index}`;";assert a in s;s=s.replace(a,b,1);s=s.replace("          appearanceRegistry.set(key,{...app,direction,eventSelected:moveIsSelected||sourceSelected,visualState,statusLabel});","          const nextStatus = nextDirection ? ` · als Nächstes ${nextDirection === \"out\" ? \"raus\" : \"rein\"} am ${formatDate(nextVisibleISO)}` : \"\";\n          appearanceRegistry.set(key,{...app,direction,eventSelected:moveIsSelected||sourceSelected,visualState,statusLabel:statusLabel+nextStatus,nextDirection,nextISO:nextVisibleISO});",1);s=s.replace("          return `<button class=\"asset-tile ${visualState}${eventClass}\" type=\"button\" data-appearance=\"${attr(key)}\" aria-label=\"${attr(app.asset.label)}, ${attr(source)}, ${attr(timing)}, ${attr(statusLabel)}\">","          const ariaNext = nextDirection ? `, als Nächstes ${nextDirection === \"out\" ? \"raus\" : \"rein\"} am ${formatDate(nextVisibleISO)}` : \"\";\n          return `<button class=\"asset-tile ${visualState}${eventClass}${nextClass}\" type=\"button\" data-appearance=\"${attr(key)}\" aria-label=\"${attr(app.asset.label)}, ${attr(source)}, ${attr(timing)}, ${attr(statusLabel)}${attr(ariaNext)}\">",1);assert "@media print{" in s and "@page{size:A3 landscape" in s and "body.print-a4" in s;p.write_text(s,encoding="utf-8")'
      - name: Arbeitsstand aktualisieren
        run: |
          python3 -c 'from pathlib import Path;p=Path("ARBEITSSTAND.md");s=p.read_text(encoding="utf-8");a="**02.09.2026**\n\n";b="- Viewer ergänzt: Nächster tatsächlicher Bewegungstermin wird dezent hellorange in den Raumkarten angedeutet; der ausgewählte Termin bleibt kräftig orange. Quellen erhalten eine leichte Auszugs-Andeutung. Drucklayout unverändert.\n";assert a in s;p.write_text(s if b in s else s.replace(a,a+b,1),encoding="utf-8")'
      - name: Commit
        run: |
          git config user.name Sauter
          git config user.email sauter@users.noreply.github.com
          git rm .github/workflows/patch-next-move.yml
          git add index.html ARBEITSSTAND.md
          git commit -m "Viewer: nächste Umzugsbewegung dezent hervorheben"
          git push
